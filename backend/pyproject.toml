[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only the application package is shipped; `data/` (local SQLite files) and `tests/` are not.
include = ["app*"]

[project]
name = "aaryx-backend"
version = "0.1.0"
description = "Backend for the AARYX personal AI companion"
requires-python = ">=3.11"
# Ranges describe what AARYX supports. The exact versions used for installs and CI are pinned
# in requirements.txt / requirements-dev.txt; refresh them with scripts/update_lock.py.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "greenlet>=3.0,<4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: marks integration tests that communicate with live local Ollama",
]

[tool.ruff]
line-length = 100
